name: Desktop build and checks
on:
  push:
    branches: [master, main, codex/desktop-app]
  pull_request:
  workflow_dispatch:
    inputs:
      macos:
        description: Build the frozen macOS development package (optional)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  windows:
    name: Windows checks and service IPC
    runs-on: windows-2022
    env:
      # Public half of the bundle signing key (repository variable). Empty until the
      # owner creates the key; such builds never install downloaded bundles.
      ZAPRET_BUNDLE_PUBLIC_KEY: ${{ vars.BUNDLE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-phase0-rust-${{ hashFiles('Cargo.lock') }}
      - run: cargo fmt --all --check
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Prepare pinned engine and compare golden import
        shell: pwsh
        run: |
          cargo run -p zbuild --locked -- prepare-windows
          if ($LASTEXITCODE -ne 0) { throw 'Engine preparation failed' }
          # zbuild writes LF on every OS, so the bytes must match the golden snapshot.
          $actual = [IO.File]::ReadAllBytes('resources/runtime/windows/strategies.json')
          $expected = [IO.File]::ReadAllBytes('contracts/golden/flowseal-1.10.4/strategies.json')
          if ([Convert]::ToBase64String($actual) -cne [Convert]::ToBase64String($expected)) { throw 'Pinned Flowseal golden import changed' }
      - name: Build service resource for the desktop workspace
        shell: pwsh
        run: |
          cargo build --release -p zapretd --locked
          if ($LASTEXITCODE -ne 0) { throw 'Service build failed' }
          Copy-Item target/release/zapretd.exe resources/runtime/zapretd.exe -Force
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Verify generated daemon contracts
        shell: pwsh
        run: |
          cargo run -p zapret-core --bin gen-contracts --locked
          if ($LASTEXITCODE -ne 0) { throw 'Contract generation failed' }
          git diff --exit-code -- contracts/daemon-api.schema.json contracts/bundle-manifest.schema.json ui/src/generated/api.ts
          if ($LASTEXITCODE -ne 0) { throw 'Generated contracts are stale' }
      - run: npm run desktop:build -- --no-bundle
      - name: Build the Rust installer
        shell: pwsh
        run: |
          cargo run -p zbuild --locked -- installer-payload --app target/release/zapret-desktop.exe --service target/release/zapretd.exe --out work/installer-payload.tar.gz
          if ($LASTEXITCODE -ne 0) { throw 'Installer payload failed' }
          $env:ZAPRET_SETUP_PAYLOAD = (Resolve-Path work/installer-payload.tar.gz).Path
          cargo build --release -p zsetup --locked
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
          New-Item -ItemType Directory -Force outputs | Out-Null
          Copy-Item target/release/zapret-setup.exe outputs/Zapret-Desktop-Setup.exe
      - name: Install, verify the service, reinstall over it, uninstall
        shell: pwsh
        run: |
          function Invoke-Setup($file, $arguments) {
            $p = Start-Process $file -ArgumentList $arguments -Wait -PassThru -NoNewWindow
            if ($p.ExitCode -ne 0) { throw "$file $arguments failed: $($p.ExitCode)" }
          }
          function Test-Service {
            cargo test -p zapret-core --locked --test service_ipc -- --ignored --test-threads=1
            if ($LASTEXITCODE -ne 0) { throw 'Service integration test failed' }
          }
          $setup = (Resolve-Path outputs/Zapret-Desktop-Setup.exe).Path
          $folder = Join-Path $env:ProgramFiles 'Zapret Desktop'
          Invoke-Setup $setup '--quiet'
          Test-Service
          # The test loaded WinDivert from our folder: the driver keeps
          # WinDivert64.sys busy, as on the first tester's PC.
          Invoke-Setup $setup '--quiet'
          Test-Service
          Invoke-Setup (Join-Path $folder 'uninstall.exe') '--uninstall --quiet'
          foreach ($i in 1..20) {
            if (-not (Get-Service ZapretDesktop -ErrorAction SilentlyContinue)) { break }
            Start-Sleep -Milliseconds 500
          }
          if (Get-Service ZapretDesktop -ErrorAction SilentlyContinue) { throw 'Service still registered after uninstall' }
          if (Test-Path (Join-Path $folder 'zapret-desktop.exe')) { throw 'App still present after uninstall' }
          sc.exe query WinDivert | Out-Null
          if ($LASTEXITCODE -ne 1060) { throw "Our WinDivert driver service is still registered ($LASTEXITCODE)" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Zapret-Desktop-Windows-x64-DEVELOPMENT
          path: outputs/Zapret-Desktop-Setup.exe
          if-no-files-found: error
  macos:
    name: Optional frozen macOS package
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.macos }}
    continue-on-error: true
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-phase0-rust-${{ hashFiles('Cargo.lock') }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: engines/macos/go.sum
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: cargo test --workspace --locked
      - run: cargo run -p zapret-core --bin gen-contracts --locked
      - run: git diff --exit-code -- contracts/daemon-api.schema.json contracts/bundle-manifest.schema.json ui/src/generated/api.ts
      - working-directory: engines/macos
        run: go test ./... && go test -race ./internal/...
      - run: python3 scripts/prepare_engines.py --platform macos
      - run: sh scripts/package_macos.sh
      - run: npm run desktop:build -- --bundles app
      - run: sh scripts/distribute_macos.sh
        env:
          CC: /usr/bin/clang
          CXX: /usr/bin/clang++
      - uses: actions/upload-artifact@v4
        with:
          name: Zapret-Desktop-macOS-FROZEN-DEVELOPMENT
          path: outputs/*
          if-no-files-found: error
