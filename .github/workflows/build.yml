name: Desktop build and checks
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-rust-${{ hashFiles('Cargo.lock') }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run check
      - run: cargo test -p zapret-core --locked
      - shell: pwsh
        run: ./scripts/build_windows.ps1
      - name: Install and verify the real service protocol
        shell: pwsh
        run: |
          $installer = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          $p = Start-Process $installer.FullName -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer failed: $($p.ExitCode)" }
          cargo test -p zapret-core --locked --test service_ipc -- --ignored
          if ($LASTEXITCODE -ne 0) { throw 'Service integration test failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Zapret-Desktop-Windows-x64-DEVELOPMENT
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-rust-${{ hashFiles('Cargo.lock') }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: engines/macos/go.sum
      - run: npm ci
      - run: npm run check
      - run: cargo test -p zapret-core --locked
      - working-directory: engines/macos
        run: go test ./... && go test -race ./internal/...
      - run: python3 scripts/prepare_engines.py --platform macos
      - run: sh scripts/package_macos.sh
      - run: npm run desktop:build -- --bundles app
      - run: sh scripts/distribute_macos.sh
        env:
          CC: /usr/bin/clang
          CXX: /usr/bin/clang++
      - uses: actions/upload-artifact@v4
        with:
          name: Zapret-Desktop-macOS-DEVELOPMENT
          path: outputs/*
          if-no-files-found: error
