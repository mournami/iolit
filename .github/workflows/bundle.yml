name: Strategy bundle
# Publishes a signed strategy bundle whenever its contents differ from the
# published one: a new Flowseal release, or our own change (targets.json, lists,
# the strategy compiler). Published at once into the rolling pre-release
# `bundle` (one release, files replaced); `releases/latest` belongs to app
# versions. Clients install it automatically and silently and roll it back if
# their checks get worse (owner's decisions, 14.11 and 15.11.2026). Scheduled
# runs happen only on the default branch.
on:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - resources/**
      - crates/zapret-core/**
      - crates/zbuild/**
      - .github/workflows/bundle.yml
  workflow_dispatch:
    inputs:
      force:
        description: Publish even if the contents equal the latest bundle
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: strategy-bundle
  cancel-in-progress: false
jobs:
  bundle:
    name: Build and publish a bundle if it changed
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Find the latest Flowseal release
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          release=$(gh api repos/Flowseal/zapret-discord-youtube/releases/latest)
          tag=$(jq -r .tag_name <<<"$release")
          name="zapret-discord-youtube-$tag.tar.gz"
          asset=$(jq -c --arg n "$name" '.assets[] | select(.name == $n)' <<<"$release")
          if [ -z "$asset" ]; then echo "::error::Flowseal $tag has no $name asset"; exit 1; fi
          digest=$(jq -r '.digest // ""' <<<"$asset")
          if [[ "$digest" != sha256:* ]]; then echo "::error::GitHub reports no SHA-256 for $name"; exit 1; fi
          pinned=$(jq -r .flowseal.version resources/upstream.lock.json)
          newest=$(printf '%s\n%s\n' "$pinned" "$tag" | sort -V | tail -n1)
          # Never go below the version the installer ships.
          if [ "$newest" != "$tag" ]; then tag="$pinned"; fi
          echo "Flowseal latest $tag, pinned $pinned"
          {
            echo "tag=$tag"
            echo "pinned=$pinned"
            echo "url=$(jq -r .browser_download_url <<<"$asset")"
            echo "sha256=${digest#sha256:}"
          } >> "$GITHUB_OUTPUT"
      - name: Require the signing key
        env:
          KEY: ${{ secrets.BUNDLE_SIGNING_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Нужен ключ подписи: добавьте секрет репозитория BUNDLE_SIGNING_KEY (base64 от 32 случайных байт). Тестовым ключом не подписываем."
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-bundle-rust-${{ hashFiles('Cargo.lock') }}
      - name: Golden tests on the pinned release
        run: cargo test -p zapret-core -p zbuild --locked
      - name: Prepare the runtime
        # Upstream values reach the shell only through env, never through expressions inside the script.
        env:
          TAG: ${{ steps.upstream.outputs.tag }}
          PINNED: ${{ steps.upstream.outputs.pinned }}
          FLOWSEAL_URL: ${{ steps.upstream.outputs.url }}
          FLOWSEAL_SHA256: ${{ steps.upstream.outputs.sha256 }}
        run: |
          set -euo pipefail
          cargo build -p zbuild --locked
          target/debug/zbuild prepare-windows
          cmp resources/runtime/windows/strategies.json contracts/golden/flowseal-1.10.4/strategies.json
          rm -rf work/base-windows && cp -r resources/runtime/windows work/base-windows
          if [ "$TAG" != "$PINNED" ]; then
            # Fails with the compiler's error if any new .bat cannot be parsed or a payload is missing.
            target/debug/zbuild prepare-windows \
              --flowseal-url "$FLOWSEAL_URL" --flowseal-sha256 "$FLOWSEAL_SHA256"
          fi
      - name: Build the bundle and compare it with the latest one
        id: bundle
        env:
          TAG: ${{ steps.upstream.outputs.tag }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          version=$(date -u +%Y.%m.%d.%H%M)
          out=work/bundle
          rm -rf "$out" work/latest && mkdir -p work/latest
          target/debug/zbuild bundle --version "$version" --flowseal "$TAG" --out "$out"
          jq -S .files "$out/manifest.unsigned.json" > work/new-files.json
          # The published bundle's file list, from its signed manifest.
          if gh release download bundle --repo "$GITHUB_REPOSITORY" --pattern manifest.json --dir work/latest 2>/dev/null; then
            jq -r .payload work/latest/manifest.json | base64 -d | jq -S .files > work/old-files.json
          else
            echo '[]' > work/old-files.json
          fi
          if cmp -s work/new-files.json work/old-files.json && [ "$FORCE" != "true" ]; then
            echo "Contents equal the latest bundle; nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - name: Sign and verify
        if: steps.bundle.outputs.publish == 'true'
        env:
          ZAPRET_BUNDLE_SIGNING_KEY: ${{ secrets.BUNDLE_SIGNING_KEY }}
          TAG: ${{ steps.upstream.outputs.tag }}
          VERSION: ${{ steps.bundle.outputs.version }}
        run: |
          set -euo pipefail
          out=work/bundle
          # Clients accept only the committed key; a different secret would
          # publish bundles that every client rejects.
          if [ "$(target/debug/zbuild public-key)" != "$(tr -d '[:space:]' < resources/bundle-public-key.txt)" ]; then
            echo "::error::Секрет BUNDLE_SIGNING_KEY не соответствует resources/bundle-public-key.txt"
            exit 1
          fi
          target/debug/zbuild sign --manifest "$out/manifest.unsigned.json" --out "$out/manifest.json"
          target/debug/zbuild verify --manifest "$out/manifest.json" \
            --archive "$out/bundle-$VERSION.tar.gz" --public-key "$(cat resources/bundle-public-key.txt)"
          {
            echo "Набор стратегий из Flowseal $TAG, коммит $GITHUB_SHA."
            echo
            echo "Изменённые файлы относительно предыдущего набора:"
            echo
            jq -r --slurpfile old work/old-files.json \
              '. - $old[0] | .[] | "- " + .path' work/new-files.json
            echo
            echo "Сравнение стратегий с закреплённой версией из resources/upstream.lock.json:"
            echo
            target/debug/zbuild changes --base work/base-windows --new resources/runtime/windows
          } > "$out/notes.md"
      - name: Publish the release
        if: steps.bundle.outputs.publish == 'true'
        env:
          TAG: ${{ steps.upstream.outputs.tag }}
          VERSION: ${{ steps.bundle.outputs.version }}
        run: |
          set -euo pipefail
          # Clients read releases/download/bundle/manifest.json.
          if ! gh release view bundle --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create bundle --repo "$GITHUB_REPOSITORY" --prerelease --latest=false \
              --target "$GITHUB_SHA" --title "Служебный: наборы стратегий" --notes "Подготовка"
          fi
          archive="bundle-$VERSION.tar.gz"
          # The archive first: a manifest never names a missing file.
          gh release upload bundle --repo "$GITHUB_REPOSITORY" --clobber "work/bundle/$archive"
          gh release upload bundle --repo "$GITHUB_REPOSITORY" --clobber work/bundle/manifest.json
          {
            echo "Служебный релиз, отсюда установленные копии сами берут наборы стратегий."
            echo "Чтобы скачать программу, откройте последний релиз «Zapret Desktop X.Y.Z»."
            echo
            echo "Текущий набор: $VERSION, Flowseal $TAG."
            echo
            cat work/bundle/notes.md
          } > work/bundle/release.md
          gh release edit bundle --repo "$GITHUB_REPOSITORY" --prerelease --latest=false \
            --title "Служебный: наборы стратегий" --notes-file work/bundle/release.md
          for old in $(gh release view bundle --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' \
              | grep '^bundle-.*\.tar\.gz$' | grep -vxF "$archive"); do
            gh release delete-asset bundle "$old" --repo "$GITHUB_REPOSITORY" --yes
          done
