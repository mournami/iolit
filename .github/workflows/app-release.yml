name: App release
# Publishes an application version (owner's decisions, 14.11 and 15.11.2026).
# Run by hand after raising the version in Cargo.toml and after "Desktop build
# and checks" passed on that commit (the first step refuses otherwise). Two places:
# - release `vX.Y.Z`, marked latest: the plain download for people, one file
#   Iolit-Setup.exe, so `releases/latest` always shows the app;
# - rolling pre-release `app`: the signed manifest and installer that installed
#   copies offer behind «Обновить».
on:
  workflow_dispatch:
    inputs:
      notes:
        description: Что нового в этой версии (по-русски, для страницы релиза)
        type: string
        default: ''
permissions:
  contents: write
  # Reads the build run of the commit being released.
  actions: read
concurrency:
  group: app-release
  cancel-in-progress: false
jobs:
  release:
    name: Build, sign and publish the installer
    runs-on: windows-2022
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - name: Require green checks on this commit
        shell: bash
        run: |
          set -euo pipefail
          # The release ships what "Desktop build and checks" installed and tested.
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs?head_sha=$GITHUB_SHA&event=push&per_page=1" \
            --jq '.workflow_runs[0] | "\(.status) \(.conclusion) \(.html_url)"')
          case "$run" in
            "completed success "*) echo "Checks passed: ${run##* }" ;;
            "") echo "::error::Для коммита $GITHUB_SHA нет запуска «Desktop build and checks». Запушьте его в main и дождитесь проверки."; exit 1 ;;
            completed*) echo "::error::«Desktop build and checks» на этом коммите не прошёл: ${run##* }"; exit 1 ;;
            *) echo "::error::«Desktop build and checks» на этом коммите ещё идёт. Запустите выпуск, когда он закончится: ${run##* }"; exit 1 ;;
          esac
      - name: Require the signing key
        shell: bash
        env:
          KEY: ${{ secrets.BUNDLE_SIGNING_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Нужен ключ подписи: секрет репозитория BUNDLE_SIGNING_KEY."
            exit 1
          fi
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-phase0-rust-${{ hashFiles('Cargo.lock') }}
      - run: npm ci
      - run: npm run build
      # The desktop crate bundles the prepared runtime and the service, so
      # both must exist before the workspace tests compile it.
      - name: Prepare the engine and the service resource
        shell: pwsh
        run: |
          cargo run -p zbuild --locked -- prepare-windows
          if ($LASTEXITCODE -ne 0) { throw 'Engine preparation failed' }
          cargo build --release -p zapretd --locked
          if ($LASTEXITCODE -ne 0) { throw 'Service build failed' }
          Copy-Item target/release/zapretd.exe resources/runtime/zapretd.exe -Force
      - run: cargo test --workspace --locked
      - name: Build the installer
        shell: pwsh
        run: |
          npm run desktop:build -- --no-bundle
          if ($LASTEXITCODE -ne 0) { throw 'Desktop build failed' }
          cargo run -p zbuild --locked -- installer-payload --app target/release/zapret-desktop.exe --service target/release/zapretd.exe --out work/installer-payload.tar.gz
          if ($LASTEXITCODE -ne 0) { throw 'Installer payload failed' }
          $env:ZAPRET_SETUP_PAYLOAD = (Resolve-Path work/installer-payload.tar.gz).Path
          cargo build --release -p zsetup --locked
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
      - name: Sign and publish
        shell: bash
        env:
          ZAPRET_BUNDLE_SIGNING_KEY: ${{ secrets.BUNDLE_SIGNING_KEY }}
          NOTES: ${{ inputs.notes }}
          APP_NOTES: Служебный релиз, отсюда установленные копии берут обновление. Чтобы скачать программу, откройте последний релиз «Iolit X.Y.Z».
        run: |
          set -euo pipefail
          zbuild=target/debug/zbuild.exe
          if [ "$($zbuild public-key | tr -d '\r')" != "$(tr -d '[:space:]' < resources/bundle-public-key.txt)" ]; then
            echo "::error::Секрет BUNDLE_SIGNING_KEY не соответствует resources/bundle-public-key.txt"
            exit 1
          fi
          mkdir -p work/previous
          previous=()
          if gh release view app --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if gh release download app --repo "$GITHUB_REPOSITORY" --pattern app-manifest.json --dir work/previous; then
              previous=(--previous work/previous/app-manifest.json)
            fi
          else
            gh release create app --repo "$GITHUB_REPOSITORY" --latest=false --prerelease --target "$GITHUB_SHA" \
              --title "Служебный: обновления приложения" --notes "$APP_NOTES"
          fi
          # Keeps the service channel out of the way of people looking for a download.
          gh release edit app --repo "$GITHUB_REPOSITORY" --prerelease --latest=false \
            --title "Служебный: обновления приложения" --notes "$APP_NOTES"
          $zbuild app-release --installer target/release/zapret-setup.exe --out work/app "${previous[@]}"
          installer=$(cd work/app && ls Iolit-Setup-*.exe)
          # The installer first: a manifest never names a missing file.
          gh release upload app --repo "$GITHUB_REPOSITORY" --clobber "work/app/$installer"
          gh release upload app --repo "$GITHUB_REPOSITORY" --clobber work/app/app-manifest.json
          for old in $(gh release view app --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' \
              | grep -E '^(Iolit|Zapret-Desktop)-Setup-.*\.exe$' | grep -vxF "$installer"); do
            gh release delete-asset app "$old" --repo "$GITHUB_REPOSITORY" --yes
          done
          version=${installer#Iolit-Setup-}
          version=${version%.exe}
          mkdir -p work/public
          cp "work/app/$installer" work/public/Iolit-Setup.exe
          sha=$(sha256sum work/public/Iolit-Setup.exe | cut -d' ' -f1)
          {
            if [ -n "$NOTES" ]; then printf '%s\n\n' "$NOTES"; fi
            echo "Скачайте **Iolit-Setup.exe** ниже и запустите. Windows 10 и 11, 64 бита."
            echo
            echo "Уже установленная программа предложит обновиться сама: кнопка «Обновить» на главном экране."
            echo
            echo "SHA-256: \`$sha\`"
          } > work/public/notes.md
          gh release create "v$version" --repo "$GITHUB_REPOSITORY" --latest --target "$GITHUB_SHA" \
            --title "Iolit $version" --notes-file work/public/notes.md \
            work/public/Iolit-Setup.exe
          echo "Published $installer and release v$version"
          # The same pair for clients that cannot reach github.com.
          sh scripts/push_mirror.sh mirror-app work/app/app-manifest.json "work/app/$installer"
