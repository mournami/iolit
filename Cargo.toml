[workspace]
resolver = "2"
members = ["crates/zapret-core", "crates/zapretd", "crates/zbuild", "crates/zsetup", "src-tauri"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "socks"] }
zapret-core = { path = "crates/zapret-core", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
