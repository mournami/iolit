[package]
name = "zapret-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
sha2.workspace = true
hex.workspace = true
reqwest = { workspace = true, optional = true }
url = "2"
idna = "1"
base64 = "0.22"
ed25519-dalek = "2"
getrandom = { version = "0.3", optional = true }
schemars = "1"
ts-rs = "12"
tar = "0.4"
flate2 = "1"

[features]
default = ["network"]
network = ["dep:reqwest", "dep:getrandom"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Pipes", "Win32_System_Services"] }

[dev-dependencies]
tempfile = "3"
