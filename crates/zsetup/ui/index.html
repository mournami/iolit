<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'">
<title>Установщик Iolit</title>
<style>
@font-face {
  font-family: "Fixel Text";
  src: url(fonts/FixelText-Regular.woff2) format("woff2");
  font-weight: 400;
  font-display: swap;
}
@font-face {
  font-family: "Fixel Text";
  src: url(fonts/FixelText-Medium.woff2) format("woff2");
  font-weight: 500;
  font-display: swap;
}
@font-face {
  font-family: "Fixel Display";
  src: url(fonts/FixelDisplay-SemiBold.woff2) format("woff2");
  font-weight: 600;
  font-display: swap;
}

:root {
  color-scheme: dark;
  --brand: #32216b;
  --brand-hover: #3f2a88;
  --accent: #ad9bff;
  --bg: #000000;
  --panel: #0f0f11;
  --raise: #1f1f22;
  --line: rgb(255 255 255 / 0.09);
  --text: #f2f2f3;
  --muted: #a1a1a8;
  --ok: #5fd39a;
  --warning: #f2b33d;
  --error: #ff7a6e;
  --sans: "Fixel Text", "Segoe UI", sans-serif;
  --display: "Fixel Display", var(--sans);
  font: 400 14px/1.45 var(--sans);
  color: var(--text);
  background: var(--bg);
  font-synthesis: none;
  -webkit-font-smoothing: antialiased;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { overflow: hidden; user-select: none; }
h1, p, pre { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

.window {
  height: 100%;
  display: grid;
  grid-template-rows: 44px minmax(0, 1fr);
  border: 1px solid var(--line);
}
.titlebar { display: flex; align-items: center; gap: 10px; padding-left: 22px; }
.wordmark { font: 600 18px/1 var(--display); }
.version { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.spacer { flex: 1; }
.titlebar .controls { display: flex; align-self: stretch; gap: 0; }
.ctl {
  width: 44px;
  display: grid;
  place-items: center;
  background: none;
  color: var(--muted);
  border: 0;
}
.ctl:hover:not(:disabled) { color: var(--text); background: var(--raise); }
.ctl.close:hover:not(:disabled) { color: #fff; background: #c42b1c; }
.ctl:focus-visible { outline-offset: -4px; }
.ctl:disabled { opacity: 0.35; }

.layout {
  min-height: 0;
  display: grid;
  grid-template-columns: 132px minmax(0, 1fr);
  gap: 24px;
  padding: 10px 22px 22px;
}
.brand-panel {
  display: grid;
  place-items: center;
  border-radius: 16px;
  background: var(--panel);
}
.emblem { position: relative; }
.emblem img { display: block; width: 76px; height: 76px; }
.outcome {
  position: absolute;
  display: none;
  place-items: center;
  right: -9px;
  bottom: -7px;
  width: 28px;
  height: 28px;
  border: 3px solid var(--panel);
  border-radius: 50%;
  background: var(--raise);
}
[data-state="success"] .outcome.success { display: grid; color: var(--ok); }
[data-state="failure"] .outcome.failure { display: grid; color: var(--error); }

.content {
  min-height: 0;
  min-width: 0;
  display: grid;
  grid-template-rows: minmax(0, 1fr) auto;
}
.body { min-width: 0; overflow: auto; padding: 12px 2px 4px; scrollbar-width: thin; }
[data-state="working"] .body, [data-state="confirm"] .body { align-content: center; }
h1 { font: 600 30px/1.15 var(--display); letter-spacing: -0.02em; text-wrap: balance; }
.subtitle { margin-top: 8px; color: var(--muted); overflow-wrap: anywhere; }

.track {
  margin-top: 22px;
  display: grid;
  gap: 11px;
  padding: 14px 15px;
  border-radius: 12px;
  background: var(--panel);
}
.stage { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.current { min-width: 0; color: var(--text); font-size: 13px; }
.percent { flex: none; color: var(--accent); font-size: 12px; font-variant-numeric: tabular-nums; }
progress {
  appearance: none;
  width: 100%;
  height: 5px;
  border: 0;
  border-radius: 5px;
  overflow: hidden;
  background: var(--raise);
}
progress::-webkit-progress-bar { background: var(--raise); }
progress::-webkit-progress-value { border-radius: 5px; background: var(--accent); transition: width 0.2s ease; }
progress:not([value]) { background: linear-gradient(90deg, var(--raise) 70%, var(--brand) 70%); }

.message {
  margin-top: 14px;
  border-left: 2px solid currentColor;
  border-radius: 0 8px 8px 0;
  padding: 9px 11px;
  background: var(--panel);
  color: var(--warning);
  font-size: 13px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  user-select: text;
}
.message.error { color: var(--error); }
.details { margin-top: 14px; color: var(--muted); font-size: 13px; }
.details summary { width: fit-content; border-radius: 4px; cursor: pointer; }
.details summary:hover { color: var(--text); }
.details pre {
  margin-top: 8px;
  padding: 10px 12px;
  border-radius: 8px;
  background: var(--panel);
  font: 12px/1.55 "Cascadia Mono", Consolas, monospace;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  user-select: text;
}

.actions { display: flex; flex-wrap: wrap; justify-content: end; gap: 8px; padding-top: 14px; }
.actions:empty { display: none; }
.btn {
  min-height: 36px;
  padding: 0 13px;
  border: 0;
  border-radius: 8px;
  background: var(--raise);
  font-size: 13px;
  font-weight: 500;
  white-space: nowrap;
}
.btn:hover { background: #2a2a2e; }
.btn.primary { background: var(--brand); color: #fff; }
.btn.primary:hover { background: var(--brand-hover); }
.btn.danger { background: var(--error); color: #260907; }
.btn.danger:hover { background: #ff9289; }
.btn.ghost { color: var(--muted); background: none; }
.btn.ghost:hover { color: var(--text); background: var(--panel); }

@media (max-width: 420px) {
  .layout { grid-template-columns: 74px minmax(0, 1fr); gap: 16px; padding-inline: 14px; }
  .emblem img { width: 48px; height: 48px; }
  h1 { font-size: 25px; }
}
@media (prefers-reduced-motion: reduce) {
  progress::-webkit-progress-value { transition: none; }
}
</style>
</head>
<body>
<div class="window" id="window">
  <header class="titlebar" id="titlebar">
    <span class="wordmark">iolit</span>
    <span class="version" id="version"></span>
    <span class="spacer"></span>
    <div class="controls">
      <button class="ctl" id="minimize" aria-label="Свернуть" title="Свернуть">
        <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true">
          <path d="M2 6h8" stroke="currentColor" stroke-width="1.2"/>
        </svg>
      </button>
      <button class="ctl close" id="close" aria-label="Закрыть" title="Закрыть">
        <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true">
          <path d="M2.5 2.5l7 7m0-7-7 7" stroke="currentColor" stroke-width="1.2"/>
        </svg>
      </button>
    </div>
  </header>
  <main class="layout">
    <div class="brand-panel" aria-hidden="true">
      <div class="emblem">
        <img src="brand.svg" width="76" height="76" alt="">
        <span class="outcome success">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none">
            <path d="m3 8 3.2 3.2L13 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="outcome failure">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none">
            <path d="M8 3.5v5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <circle cx="8" cy="11.5" r="1" fill="currentColor"/>
          </svg>
        </span>
      </div>
    </div>
    <div class="content">
      <div class="body" id="body">
        <h1 id="title"></h1>
        <p class="subtitle" id="subtitle"></p>
        <div class="track" id="track" hidden>
          <div class="stage">
            <span class="current" id="current" role="status">Подготовка</span>
            <span class="percent" id="percent" aria-hidden="true"></span>
          </div>
          <progress id="progress" aria-label="Ход выполнения"></progress>
        </div>
        <p class="message error" id="error" role="alert" hidden></p>
        <p class="message" id="notice" role="status" hidden></p>
        <details class="details" id="details" hidden>
          <summary>Подробности</summary>
          <pre id="log"></pre>
        </details>
      </div>
      <div class="actions" id="actions"></div>
    </div>
  </main>
</div>

<script>
'use strict';
const setup = window.SETUP || { mode: 'install', version: '', data: '' };
const $ = (id) => document.getElementById(id);
const send = (message) => window.ipc?.postMessage(message);

const copy = {
  install: {
    work: ['Установка Iolit', 'Приложение откроется автоматически после установки.'],
    success: ['Iolit установлен', 'Настроить обход можно на главном экране Iolit.'],
    failure: 'Не удалось установить Iolit',
  },
  uninstall: {
    confirm: ['Удалить Iolit?', 'Настройки и список сайтов сохранятся' + (setup.data ? ' в ' + setup.data : '') + '.'],
    work: ['Удаление Iolit', 'Удаляем приложение, службу и ярлыки.'],
    success: ['Iolit удалён', 'Сохранённые настройки можно использовать при следующей установке.'],
    failure: 'Не удалось удалить Iolit',
  },
  stop: {
    work: ['Остановка WinDivert', 'Завершаем работу движка.'],
    success: ['WinDivert остановлен', 'Обход можно снова включить в приложении.'],
    failure: 'Не удалось остановить WinDivert',
  },
}[setup.mode];

let total = 0;
let completed = 0;
let running = false;
let notes = [];
let notices = [];

function button(label, style, action) {
  const element = document.createElement('button');
  element.className = 'btn ' + style;
  element.textContent = label;
  element.onclick = action;
  return element;
}

function state(name, title, subtitle) {
  $('window').dataset.state = name;
  $('title').textContent = title;
  $('subtitle').textContent = subtitle;
  $('subtitle').hidden = !subtitle;
  $('body').scrollTop = 0;
}

function message(id, text) {
  const element = $(id);
  element.hidden = !text;
  element.textContent = text;
}

function progress() {
  if (!total) {
    $('progress').removeAttribute('value');
    $('percent').textContent = '';
    return;
  }
  $('progress').max = total;
  $('progress').value = Math.min(completed, total);
  $('percent').textContent = Math.round($('progress').value / total * 100) + '%';
}

function start() {
  running = true;
  total = 0;
  completed = 0;
  notes = [];
  notices = [];
  state('working', ...copy.work);
  $('current').textContent = 'Подготовка';
  $('track').hidden = false;
  $('details').hidden = true;
  $('details').open = false;
  $('log').textContent = '';
  message('notice', '');
  message('error', '');
  progress();
  $('actions').replaceChildren();
  $('close').disabled = true;
  send('start');
}

function confirmRemoval() {
  state('confirm', ...copy.confirm);
  const cancel = button('Отмена', 'ghost', () => send('close'));
  $('actions').replaceChildren(cancel, button('Удалить', 'danger', start));
  cancel.focus();
}

function finish(result) {
  running = false;
  $('close').disabled = false;
  $('track').hidden = true;
  $('details').hidden = !notes.length;
  $('log').textContent = notes.join('\n');
  message('notice', notices.join('\n\n'));
  if (result.ok) {
    state('success', ...copy.success);
    if (setup.mode === 'install' && !notes.length && !notices.length) {
      setTimeout(() => send('close'), 1600);
    } else {
      const close = button('Закрыть', 'primary', () => send('close'));
      $('actions').replaceChildren(close);
      close.focus();
    }
    return;
  }

  state('failure', copy.failure, '');
  message('error', result.error);
  const copyError = button('Скопировать', '', async () => {
    try {
      await navigator.clipboard.writeText([copy.failure, setup.version, result.error, ...notices, ...notes].join('\n'));
      copyError.textContent = 'Скопировано';
    } catch {
      copyError.textContent = 'Не скопировано';
    }
  });
  const retry = button('Повторить', 'primary', start);
  $('actions').replaceChildren(button('Закрыть', 'ghost', () => send('close')), copyError, retry);
  retry.focus();
}

window.zsetup = (event) => {
  switch (event.type) {
    case 'plan':
      total = Math.max(1, event.total);
      progress();
      break;
    case 'step':
      $('current').textContent = event.name;
      break;
    case 'step_done':
      if (event.ok) completed += 1;
      notes.push(...event.notes);
      progress();
      break;
    case 'note':
      notices.push(event.text);
      break;
    case 'done':
      finish(event);
      break;
  }
};

$('version').textContent = setup.version;
$('minimize').onclick = () => send('minimize');
$('close').onclick = () => { if (!running) send('close'); };
$('titlebar').addEventListener('mousedown', (event) => {
  if (event.button === 0 && !event.target.closest('button')) send('drag');
});
document.addEventListener('contextmenu', (event) => event.preventDefault());
document.addEventListener('keydown', (event) => {
  if (event.key === 'Escape' && !running) send('close');
});

if (copy.confirm) confirmRemoval(); else start();
</script>
</body>
</html>
