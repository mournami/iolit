<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'">
<title>Установка Iolit</title>
<style>
/* Same palette and type as the app (ui/src/style.css, dark theme). */
@font-face { font-family: 'Inter Variable'; font-weight: 100 900; font-display: block;
  src: url(fonts/inter-cyrillic-wght-normal.woff2) format('woff2');
  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
@font-face { font-family: 'Inter Variable'; font-weight: 100 900; font-display: block;
  src: url(fonts/inter-latin-wght-normal.woff2) format('woff2');
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
@font-face { font-family: 'Geist Mono'; font-weight: 400; font-display: block;
  src: url(fonts/geist-mono-cyrillic-400-normal.woff2) format('woff2');
  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
@font-face { font-family: 'Geist Mono'; font-weight: 400; font-display: block;
  src: url(fonts/geist-mono-latin-400-normal.woff2) format('woff2');
  unicode-range: U+0000-00FF, U+2000-206F; }

:root {
  color-scheme: dark;
  --bg: #000000; --panel: #0c0e0d; --raise: #151816; --raise-2: #1c201e;
  --line: #1d211f; --line-2: #2a2f2c;
  --text: #f2f5f3; --text-2: #98a09c; --text-3: #5f6763;
  --g: #3ee387; --g-text: #4be892; --g-soft: rgb(62 227 135 / 0.11); --on-g: #03140a;
  --red: #ff6b5e; --red-soft: rgb(255 107 94 / 0.12);
  --amber: #f2b33d; --amber-soft: rgb(242 179 61 / 0.12);
  --hover: rgb(255 255 255 / 0.05);
  --sans: 'Inter Variable', 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif;
  --mono: 'Geist Mono', 'Cascadia Mono', Consolas, monospace;
  font-family: var(--sans); font-size: 14px; line-height: 1.4; color: var(--text);
  font-feature-settings: 'cv05', 'calt'; font-synthesis: none;
  -webkit-font-smoothing: antialiased;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: var(--bg); overflow: hidden; user-select: none; cursor: default; }
h1, p, ul { margin: 0; padding: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--g); outline-offset: 2px; border-radius: 6px; }

.win { height: 100%; display: flex; flex-direction: column; border: 1px solid var(--line); }

/* Title row: the whole row drags the window; only the two buttons do not. */
.bar { height: 38px; flex: none; display: flex; align-items: center; padding-left: 14px; }
.bar .ver { flex: 1; font-size: 12px; color: var(--text-3); }
.ctl { width: 44px; height: 38px; border: 0; background: none; color: var(--text-2);
  display: grid; place-items: center; }
.ctl:hover:not(:disabled) { background: var(--hover); color: var(--text); }
.ctl.x:hover:not(:disabled) { background: #c42b1c; color: #fff; }
.ctl:disabled { opacity: 0.3; }

.body { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center;
  padding: 18px 32px 0; text-align: center; }

.mark { position: relative; width: 76px; height: 76px; margin-top: 14px; flex: none; }
.mark svg { position: relative; z-index: 1; display: block; }
.mark::before { content: ''; position: absolute; inset: -10px; border-radius: 28px;
  background: var(--g-soft); opacity: 0; transition: opacity 0.3s; }
.working .mark::before { opacity: 1; animation: pulse 1.8s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { transform: scale(0.92); opacity: 0.4; } 50% { transform: scale(1.08); opacity: 1; } }
.fail .mark svg rect { fill: var(--raise-2); }
.fail .mark svg path { stroke: var(--red); }

h1 { margin-top: 26px; font-size: 20px; font-weight: 600; letter-spacing: -0.02em; }
.sub { margin-top: 8px; min-height: 38px; max-width: 330px; font-size: 13px; line-height: 1.45; color: var(--text-2); }

.track { width: 100%; max-width: 300px; margin-top: 22px; }
.progress { height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; }
.progress span { display: block; height: 100%; width: 0; border-radius: 4px; background: var(--g); transition: width 0.35s ease; }
.count { margin-top: 9px; font-size: 12px; color: var(--text-3); font-variant-numeric: tabular-nums; }

.details { width: 100%; margin-top: 18px; max-height: 120px; overflow: auto; padding: 10px 12px;
  border-radius: 10px; text-align: left; font-family: var(--mono); font-size: 11.5px; line-height: 1.6;
  color: var(--text-2); background: var(--panel); border: 1px solid var(--line); white-space: pre-wrap;
  overflow-wrap: anywhere; user-select: text; cursor: text; }
.details.bad { color: var(--red); background: var(--red-soft); border-color: transparent; }
.details.warn { color: var(--amber); background: var(--amber-soft); border-color: transparent; }

.actions { flex: none; display: flex; justify-content: center; gap: 8px; padding: 18px 24px 24px; min-height: 76px; }
.btn { height: 34px; padding: 0 16px; border-radius: 9px; display: inline-flex; align-items: center;
  font-size: 13px; font-weight: 500; background: var(--raise); border: 1px solid var(--line-2);
  transition: background-color 0.15s; }
.btn:hover:not(:disabled) { background: var(--raise-2); }
.btn.primary { background: var(--g); border-color: transparent; color: var(--on-g); font-weight: 600; }
.btn.primary:hover:not(:disabled) { background: var(--g-text); }
.btn.danger { background: var(--red); border-color: transparent; color: #1a0503; font-weight: 600; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--text-2); }
.btn.ghost:hover:not(:disabled) { background: var(--hover); color: var(--text); }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div class="win" id="win">
  <div class="bar" id="bar">
    <span class="ver" id="ver"></span>
    <button class="ctl" id="min" aria-label="Свернуть" title="Свернуть">
      <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6h8" stroke="currentColor" stroke-width="1.2"/></svg>
    </button>
    <button class="ctl x" id="close" aria-label="Закрыть" title="Закрыть">
      <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7" stroke="currentColor" stroke-width="1.2"/></svg>
    </button>
  </div>

  <main class="body">
    <div class="mark" aria-hidden="true">
      <svg width="76" height="76" viewBox="0 0 20 20">
        <rect width="20" height="20" rx="6" fill="var(--g)"/>
        <path d="M5.5 6.2h9l-9 7.6h9" fill="none" stroke="var(--on-g)" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1 id="title"></h1>
    <p class="sub" id="sub" aria-live="polite"></p>
    <div class="track" id="track" hidden>
      <div class="progress" role="progressbar" aria-label="Ход установки" aria-valuemin="0" id="bar-p"><span id="fill"></span></div>
      <p class="count" id="count"></p>
    </div>
    <div class="details" id="details" hidden></div>
  </main>

  <div class="actions" id="actions"></div>
</div>

<script>
'use strict';
const S = window.SETUP || { mode: 'install', version: '', data: '' };
const $ = (id) => document.getElementById(id);
const send = (m) => window.ipc && window.ipc.postMessage(m);

const TEXT = {
  install: {
    ask: null,
    work: 'Устанавливаем Iolit',
    ok: 'Готово',
    okSub: 'Открываем программу. Обход выключен, пока вы не включите его кнопкой.',
    fail: 'Не получилось установить',
  },
  uninstall: {
    ask: ['Удалить Iolit?', 'Удалим программу, службу и ярлыки. Настройки и ваши домены останутся' + (S.data ? ' в ' + S.data : '') + '.'],
    work: 'Удаляем Iolit',
    ok: 'Iolit удалён',
    okSub: 'Спасибо, что пользовались.',
    fail: 'Не получилось удалить',
  },
  stop: {
    ask: null,
    work: 'Останавливаем WinDivert',
    ok: 'WinDivert остановлен',
    okSub: 'Обход выключен до перезапуска компьютера или до включения в программе.',
    fail: 'Не получилось остановить WinDivert',
  },
}[S.mode];

let total = 1, done = 0, running = false, notes = [], lastError = '';

function button(label, cls, onClick) {
  const b = document.createElement('button');
  b.className = 'btn ' + cls;
  b.textContent = label;
  b.onclick = onClick;
  return b;
}
function actions(...buttons) {
  $('actions').replaceChildren(...buttons);
}
function setState(cls) { $('win').className = 'win ' + cls; }
function progress() {
  const p = Math.min(1, done / total);
  $('fill').style.width = (p * 100).toFixed(1) + '%';
  $('bar-p').setAttribute('aria-valuemax', String(total));
  $('bar-p').setAttribute('aria-valuenow', String(done));
  $('count').textContent = done + ' из ' + total;
}
function details(lines, tone) {
  const d = $('details');
  d.hidden = !lines.length;
  d.className = 'details' + (tone ? ' ' + tone : '');
  d.textContent = lines.join('\n');
}

function start() {
  running = true; total = 1; done = 0; notes = []; lastError = '';
  setState('working');
  $('title').textContent = TEXT.work;
  $('sub').textContent = 'Готовимся…';
  $('track').hidden = false;
  details([]);
  progress();
  actions();
  $('close').disabled = true;
  send('start');
}

function ask() {
  setState('');
  $('title').textContent = TEXT.ask[0];
  $('sub').textContent = TEXT.ask[1];
  actions(button('Удалить', 'danger', start), button('Отмена', 'ghost', () => send('close')));
}

window.zsetup = (e) => {
  switch (e.type) {
    case 'plan': total = Math.max(1, e.total); progress(); break;
    case 'step': $('sub').textContent = e.name + '…'; break;
    case 'step_done':
      done += 1; progress();
      for (const n of e.notes) notes.push(n);
      break;
    case 'note': notes.push(e.text); break;
    case 'done':
      running = false;
      $('close').disabled = false;
      if (e.ok) {
        done = total; progress();
        setState('ok');
        $('title').textContent = TEXT.ok;
        $('sub').textContent = TEXT.okSub;
        $('track').hidden = true;
        details(notes, notes.length ? 'warn' : '');
        // Nothing to read: the installer gets out of the way, as the app opens.
        if (S.mode === 'install' && !notes.length) {
          actions();
          setTimeout(() => send('close'), 1600);
        } else {
          actions(button('Закрыть', 'primary', () => send('close')));
        }
      } else {
        lastError = e.error;
        setState('fail');
        $('title').textContent = TEXT.fail;
        $('sub').textContent = 'Ничего не сломано: можно повторить. Если ошибка повторяется, пришлите текст ниже разработчикам.';
        $('track').hidden = true;
        details([e.error, ...notes], 'bad');
        const copy = button('Скопировать', '', async () => {
          try {
            await navigator.clipboard.writeText([TEXT.fail, S.version, e.error, ...notes].join('\n'));
            copy.textContent = 'Скопировано';
          } catch { copy.textContent = 'Не удалось'; }
        });
        actions(button('Повторить', 'primary', start), copy, button('Закрыть', 'ghost', () => send('close')));
      }
      break;
  }
};

$('ver').textContent = 'Iolit ' + S.version;
$('min').onclick = () => send('minimize');
$('close').onclick = () => { if (!running) send('close'); };
$('bar').addEventListener('mousedown', (ev) => {
  if (ev.button === 0 && !ev.target.closest('button')) send('drag');
});
document.addEventListener('contextmenu', (ev) => ev.preventDefault());
document.addEventListener('keydown', (ev) => {
  if (ev.key === 'Escape' && !running && !$('actions').querySelector('.primary')) send('close');
});

if (TEXT.ask) ask(); else start();
</script>
</body>
</html>
