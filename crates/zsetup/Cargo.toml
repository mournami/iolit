[package]
name = "zsetup"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Windows installer for Zapret Desktop"

[[bin]]
name = "zapret-setup"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
flate2 = "1"
tar = "0.4"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
winreg = "0.56"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_Storage_FileSystem"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
] }
