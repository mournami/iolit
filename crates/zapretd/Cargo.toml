[package]
name = "zapretd"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
zapret-core = { workspace = true, features = ["network"] }
reqwest.workspace = true
base64 = "0.22"
# Local Telegram proxy (`src/telegram`): MTProto obfuscation and TLS to the
# WebSocket gateway. rustls and ring are the ones reqwest already builds.
sha2.workspace = true
hex.workspace = true
aes = "0.8"
ctr = "0.9"
getrandom = { version = "0.3", features = ["std"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_NetworkManagement_Dns", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Registry", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
# Paused time lets selection tests cover the 3-minute limit instantly.
tokio = { workspace = true, features = ["test-util"] }
ed25519-dalek = "2"
